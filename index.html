const MAXLV=15,costInfra=n=>Math.round(200*Math.pow(1.3,n.infra-1)),costTech=n=>Math.round(300*Math.pow(1.3,n.tech-1));
function doInfra(n){if(n.infra>=MAXLV||n.gold<costInfra(n))return false;n.gold-=costInfra(n);n.infra++;return true}
function doTech(n){if(n.tech>=MAXLV||n.gold<costTech(n))return false;n.gold-=costTech(n);n.tech++;return true}
function doRecruit(n,b){if(n.gold<15||(n.eq||0)<10)return false;const c=b!==undefined&&S.prov[b].owner===n.id?b:capOf(n.id);if(c<0)return false;n.gold-=15;n.eq-=10;addDiv(n.id,c,10);return true}
// ===== 開戦理由・戦争目標・講和 =====
const CBCOST=40,CBDAYS=30,MAXGOAL=6;let DLG=null;
const blockVal=i=>clamp(Math.round(Math.sqrt(BP[i])*.6),2,12);
const pairW=(w,a,b)=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a);
function newWar(a,b,goals,main){const w={id:S.wid++,a,b,goals:goals||[],ws:0,start:S.day,main:!!main};S.wars.push(w);return w}
function openWarRec(a,b,goals,main){S.wars=S.wars.filter(w=>!pairW(w,a,b));return newWar(a,b,goals,main)}
function getWar(a,b){return S.wars.find(w=>pairW(w,a,b))||newWar(a,b,[],false)}
const wsOf=(w,id)=>id===w.a?w.ws:-w.ws;
// 開戦理由：領土回復（自国の核領土を相手が持つ）／作成済み／国際的非難（悪名40超）
function hasCB(a,b){
 if(owned(b).some(i=>BC[i]===a))return{t:"core",l:"領土回復"};
 const c=S.cbs.find(c=>c.a===a&&c.b===b&&c.ready);if(c)return{t:"fab",l:"開戦理由",d:c.exp-S.day};
 if((S.nations[b].infamy||0)>40)return{t:"inf",l:"国際的非難"};
 return null}
function startCB(a,b){const A=S.nations[a];
 if(R(a,b).war||!neighbors(a).includes(b)||S.cbs.some(c=>c.a===a&&c.b===b)||A.gold<CBCOST){if(a===S.player)toast(A.gold<CBCOST?`開戦理由の作成には💰${CBCOST}が必要`:"開戦理由は作れない");return false}
 A.gold-=CBCOST;S.cbs.push({a,b,start:S.day,days:CBDAYS,ready:false});if(a===S.player)toast(`${S.nations[b].name}国への開戦理由を作成中（${CBDAYS}日）`);return true}
function goalCands(a,b){
 const d=new Array(NB).fill(-1),q=[];owned(a).forEach(i=>{d[i]=0;q.push(i)});
 for(let k=0;k<q.length;k++)for(const j of ADJ[q[k]])if(d[j]<0){d[j]=d[q[k]]+1;q.push(j)}
 return owned(b).filter(i=>d[i]>=0&&d[i]<=3).sort((x,y)=>(+(BC[y]===a))-(+(BC[x]===a))||d[x]-d[y]||blockVal(y)-blockVal(x)).slice(0,16)}
function aiGoals(a,b){const n=S.nations[a],c=owned(b).filter(i=>ADJ[i].some(j=>S.prov[j].owner===a));
 c.sort((x,y)=>(+(BC[y]===a))-(+(BC[x]===a))||blockVal(y)-blockVal(x));return c.slice(0,3+(n.ai>.6?1:0))}
function declareWar(a,b,o){o=o||{};const r=R(a,b),A=S.nations[a],B=S.nations[b];
 if(r.war||!A.alive||!B.alive)return false;
 if(S.day<(r.truce||0)){say(a,`休戦中のため宣戦できない（あと${r.truce-S.day}日）`);return false}
 const cb=hasCB(a,b);if(!cb&&!o.free){say(a,"開戦理由がない");return false}
 if(cb){if(cb.t==="fab")S.cbs=S.cbs.filter(c=>!(c.a===a&&c.b===b))}else A.infamy=(A.infamy||0)+25;
 const goals=(o.goals||[]).filter(i=>S.prov[i].owner===b).slice(0,cb?MAXGOAL:3);
 if(r.ally){r.ally=false;A.betray=(A.betray||0)+1;logm(`${A.name}国が同盟国${B.name}国を裏切った！`)}
 r.war=true;r.trade=false;r.since=S.day;openWarRec(a,b,goals,true);
 const pv=a===S.player||b===S.player;
 logm(`${A.name}国が${B.name}国に宣戦布告！${cb?"":"（無理由）"}${goals.length?"　戦争目標："+(pv?goals.map(i=>BN[i]).join("・"):goals.length+"か所"):""}`);
 for(const x of S.nations){if(!x.alive||x.id===a||x.id===b)continue;
  const dA=R(x.id,b).ally&&!R(x.id,a).ally&&Math.random()<.5,aA=!dA&&R(x.id,a).ally&&!R(x.id,b).ally&&Math.random()<.3;
  if(!dA&&!aA)continue;const p=x.id,q=dA?a:b,rr=R(p,q);if(rr.war||S.day<(rr.truce||0))continue;
  rr.war=true;rr.trade=false;rr.since=S.day;openWarRec(p,q,[],false);logm(`${x.name}国が参戦し${S.nations[q].name}国に宣戦した。`);separate(p,q);if(q===S.player)ping(`${x.name}国が参戦してきた！`,'war')}
 if(b===S.player)ping(`${A.name}国があなたに宣戦布告！`,'war');else if(a===S.player)toast(`${B.name}国に宣戦布告した。`);
for(const x of S.nations){if(x.alive&&x.id!==a&&x.id!==b&&R(a,x.id).ally&&R(x.id,b).ally)addTrust(a,x.id,-15)}
 separate(a,b);return true}
// 講和：要求できるのは「敵の領土」と「今の戦争で占領した土地（要求しないと返還）」
function demandCands(w,win){const lose=win===w.a?w.b:w.a,r=[];
 for(let i=0;i<NB;i++){const p=S.prov[i];if(p.owner===lose||(p.owner===win&&p.wid===w.id&&p.prev===lose))r.push(i)}return r}
function demandCost(w,win,i){let c=blockVal(i);if(S.prov[i].owner!==win)c*=2;if(win===w.a&&w.goals.includes(i))c*=.6;if(BC[i]===win)c*=.5;return Math.max(1,Math.round(c*10)/10)}
function autoDemands(w,win,budget){const ks=new Set(),gs=win===w.a?w.goals:[];let left=budget;
 const c=demandCands(w,win).map(i=>({i,c:demandCost(w,win,i),g:gs.includes(i)?0:S.prov[i].owner===win?1:2})).filter(x=>x.g<2).sort((x,y)=>x.g-y.g||x.c-y.c);

  if(keep.has(i)){p.wid=undefined;p.prev=undefined;continue}
  const pr=p.prev;if(pr!==undefined&&S.nations[pr].alive&&p.owner!==pr&&(p.owner===w.a||p.owner===w.b)){p.owner=pr;p.u=0;p.ur=0;flash[i]=performance.now()}
  p.wid=undefined;p.prev=undefined}
 const kept=[...keep].filter(i=>S.prov[i].owner===win);
 r.war=false;r.truce=S.day+60+(kept.length?30:0);S.wars=S.wars.filter(x=>x!==w);SDC={};expel();
 logm(`${W.name}国と${L.name}国が講和した${kept.length?`（${W.name}国が${kept.length}ブロックを確保）`:"（白紙和平）"}。`);
 if(win===S.player||lose===S.player)toast(kept.length?`講和が成立した（${W.name}国が${kept.length}ブロックを確保）`:"白紙和平が成立した")}
function makePeace(a,b){if(!R(a,b).war)return false;signPeace(getWar(a,b),a,new Set());return true}
function tickWars(){
 S.wars=S.wars.filter(w=>S.nations[w.a].alive&&S.nations[w.b].alive&&R(w.a,w.b).war);
 const cnt=new Map();for(let i=0;i<NB;i++){const p=S.prov[i];if(p.wid!==undefined){const k=p.wid+":"+p.owner;cnt.set(k,(cnt.get(k)||0)+1)}}
 for(const w of S.wars){const d=clamp((cnt.get(w.id+":"+w.a)||0)-(cnt.get(w.id+":"+w.b)||0),-8,8);if(d)w.ws=clamp(w.ws+.05*d,-100,100)}
 S.cbs=S.cbs.filter(c=>S.nations[c.a].alive&&S.nations[c.b].alive&&!R(c.a,c.b).war&&(!c.ready||S.day<c.exp));
 for(const c of S.cbs)if(!c.ready&&S.day-c.start>=c.days){c.ready=true;c.exp=S.day+120;if(c.a===S.player)toast(`${S.nations[c.b].name}国への開戦理由が完成した`)}
 S.nations.forEach(n=>{if(n.infamy>0)n.infamy=Math.max(0,n.infamy-.04*(n.pol==="diplo"?4:1))})}
// ===== AI：理由を作り、目標を決めて戦い、スコアで講和 =====
function aiWar(n,o){const id=n.id;if(R(id,o).war||shareAlly(id,o))return;
 if(hasCB(id,o)){declareWar(id,o,{goals:aiGoals(id,o)});return}
 if(!S.cbs.some(c=>c.a===id&&c.b===o)&&S.cbs.filter(c=>c.a===id).length<2&&n.gold>=CBCOST+50&&neighbors(id).includes(o))startCB(id,o)}
function aiPeace(n,w){const id=n.id,o=w.a===id?w.b:w.a,my=wsOf(w,id),d=S.day-w.start;if(o===S.player)return;
 const done=w.a===id&&w.goals.length>0&&w.goals.every(g=>S.prov[g].owner===id);
 if(my>=40&&(done||my>=70||d>120)&&Math.random()<.25){signPeace(w,id,autoDemands(w,id,my));return}
 if(my<=-35&&Math.random()<.15){signPeace(w,o,autoDemands(w,o,-my));return}
 if(d>150&&Math.abs(my)<15&&Math.random()<.05){signPeace(w,id,new Set());return}
 if(d>240&&Math.random()<.03)signPeace(w,id,new Set())}

 DLG={t:"war",b,sel:new Set(goalCands(S.player,b).filter(i=>BC[i]===S.player).slice(0,MAXGOAL))};speed=0;renderDlg()}

function warHTML(B){const a=S.player,A=S.nations[a],b=DLG.b,r=R(a,b),cb=hasCB(a,b),pc=S.cbs.find(c=>c.a===a&&c.b===b&&!c.ready),tr=(r.truce||0)-S.day;

 else st=`<div class="card"><b>開戦理由がない</b><div class="mu">${pc?`作成中（あと${pc.days-(S.day-pc.start)}日）`:`作成に${CBDAYS}日・💰${CBCOST}`}。無理由で宣戦すると悪名+25（目標は最大3か所。悪名40超で外交を拒否され、全国に開戦理由を与える）。</div></div>`;

 <div style="margin-top:8px">${tr>0?"":cb?'<button class="pri" data-d="war">宣戦布告</button>':(pc?"":`<button data-d="cb" ${A.gold<CBCOST?"disabled":""}>開戦理由を作る（💰${CBCOST}）</button>`)+'<button class="dg" data-d="free">無理由で宣戦（悪名+25）</button>'}<button data-d="close">キャンセル</button></div>`}
function peaceHTML(B){const a=S.player,b=DLG.b,w=getWar(a,b),my=wsOf(w,a),sel=DLG.sel;
 const bar=`<div class="bar"><i style="left:50%;width:${Math.max(0,my)/2}%;background:#4caf70"></i><i style="right:50%;width:${Math.max(0,-my)/2}%;background:#d9534f"></i><i style="left:50%;width:1px;background:#fff"></i></div>`;

  else if(nb.has(o.id)){const cb=hasCB(n.id,o.id),pc=S.cbs.find(c=>c.a===n.id&&c.b===o.id&&!c.ready);

  else{b+=r.ally?`<button data-a="unally" data-b="${o.id}">同盟破棄</button>`:`<button data-a="ally" data-b="${o.id}">同盟</button>`;
   b+=r.trade?`<button data-a="untrade" data-b="${o.id}">貿易解消</button>`:`<button data-a="trade" data-b="${o.id}">貿易</button>`;

  return `<div class="row"><div class="nm"><span class="dot" style="background:${colOf(o.id)}"></span><a data-a="focus" data-b="${o.id}" style="color:var(--tx);text-decoration:underline dotted;cursor:pointer">${o.name}国</a> ${nb.has(o.id)?'<span class="tag">隣接</span>':""}${st}<div class="mu">国力${Math.round(pow(o))} 領土${owned(o.id).length}${info}</div></div><div class="bt">${b}</div></div>`}).join("")||"<div class='mu'>他国は存在しません。</div>");
}
function tAlly(){
 const n=me(),al=alliesOf(n.id),wars=S.nations.filter(o=>o.alive&&R(n.id,o.id).war);
 const trc=t=>t>=60?"#6fd48a":t>=30?"#e0a030":"#ff8d88";
 const jo=S.offers.map((o,i)=>[o,i]).filter(([o])=>o.t==="join").map(([o,i])=>`<div class="card" style="border-color:var(--ac)"><b>${S.nations[o.f].name}国</b>から参戦要請<div>${S.nations[o.e].name}国との戦争に加わってほしい <span class="mu">（承諾で信頼+10／拒否で−8／放置で−5）</span></div><div style="margin-top:6px"><button class="pri" data-a="oy" data-i="${i}">共に戦う</button> <button data-a="on" data-i="${i}">断る</button></div></div>`).join("");
 const cards=al.map(o=>{const t=trustOf(n.id,o.id),ew=S.nations.filter(x=>x.alive&&x.id!==o.id&&x.id!==n.id&&R(o.id,x.id).war),
  callable=wars.filter(e=>!R(o.id,e.id).war&&!R(o.id,e.id).ally);
  const tags=ew.map(x=>`<span class="tag ${R(n.id,x.id).war?"a":"w"}">${x.name}${R(n.id,x.id).war?"（共同）":""}</span>`).join("")||'<span class="mu">なし</span>';
  return `<div class="card"><div class="row" style="border:0;padding:0"><div class="nm"><span class="dot" style="background:${colOf(o.id)}"></span><b><a data-a="focus" data-b="${o.id}" style="color:var(--tx);text-decoration:underline dotted;cursor:pointer">${o.name}国</a></b> <span class="mu">国力${Math.round(pow(o))}／領土${owned(o.id).length}／兵力${Math.floor(o.army)}</span></div></div>
  <div style="font-size:12px">信頼度 <b style="color:${trc(t)}">${Math.round(t)}</b>/100 <span class="mu">（共通の敵と戦うと上昇。0で同盟解消）</span></div><div class="bar"><i style="width:${t}%;background:${trc(t)}"></i></div>
  <div style="font-size:12px">交戦中：${tags}</div>
  <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${callable.map(e=>`<button class="pri" data-a="jreq" data-b="${o.id}" data-e="${e.id}">${e.name}国へ参戦要請</button>`).join("")||'<span class="mu" style="font-size:12px">要請できる戦争がありません</span>'}</div>
  <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px"><button data-a="sgold" data-b="${o.id}" ${n.gold<100?"disabled":""}>資金支援 💰100</button><button data-a="seq" data-b="${o.id}" ${(n.eq||0)<20?"disabled":""}>装備支援 🔧20</button><button data-a="aid" data-b="${o.id}">援助要請</button><button class="dg" data-a="unally" data-b="${o.id}">同盟破棄</button></div></div>`}).join("");
 const meds=[];for(let x=0;x<al.length;x++)for(let y=x+1;y<al.length;y++){const A=al[x],B=al[y];if(!R(A.id,B.id).ally&&!R(A.id,B.id).war)meds.push(`<div class="row"><div class="nm"><span class="dot" style="background:${A.color}"></span>${A.name}国 ⇄ <span class="dot" style="background:${B.color}"></span>${B.name}国${R(A.id,B.id).truce>S.day?' <span class="mu">(休戦中)</span>':''}</div><button class="pri" data-a="mediate" data-b="${A.id}" data-e="${B.id}">同盟を仲介</button></div>`)}
 const fronts=wars.map(e=>{const co=al.filter(a=>R(a.id,e.id).war);return `<div class="row"><div class="nm"><span class="dot" style="background:${colOf(e.id)}"></span>${e.name}国</div><div>${co.length?co.map(a=>`<span class="tag a">${a.name}</span>`).join(""):'<span class="mu">単独</span>'}</div></div>`}).join("");
 return `<div class="mu" style="font-size:12px;margin-bottom:6px">同盟 ${al.length}/3。同盟国の領土は自由に通行でき、補給も受けられます。同盟国どうしが同じ戦闘に加わると<b>連携ボーナス+12%</b>。同盟国どうしの同盟（三国同盟）は「仲介」で結べます。同じ同盟圏は同じ色で表示されます。共通の敵と戦うほど信頼度が上がり、要請が通りやすくなります。</div>`
 +jo+(meds.length?`<div class="card"><b>三国同盟の仲介</b><div class="mu" style="font-size:12px">あなたの同盟国どうしを同盟させます（成功すると同じ色になり、互いに戦わなくなります）</div>${meds.join("")}</div>`:"")+(cards||'<div class="mu">同盟国がありません。外交タブから同盟を申し込めます（国力差が極端でない国・悪名40以下）。</div>')
 +`<div style="margin:10px 0 2px"><b>共同戦線</b></div>`+(fronts||'<div class="mu">戦争中の国はありません。</div>');
}
function tRank(){
 const l=[...alive()].sort((a,b)=>pow(b)-pow(a));
 return l.slice(0,15).map((o,i)=>`<div class="row"><b style="width:26px">${i+1}</b><div class="nm"><span class="dot" style="background:${colOf(o.id)}"></span><a data-a="focus" data-b="${o.id}" style="color:var(--tx);text-decoration:underline dotted;cursor:pointer">${o.name}国</a>${o.id===S.player?" ★":""}</div><span class="mu">領土${owned(o.id).length}　国力${Math.round(pow(o))}</span></div>`).join("")+`<div class="mu" style="margin-top:6px">占領した県は30日間収入ゼロ・人口20%減。占領地は不穏度が上がるので駐屯と慰撫を。領土が増えるほど侵攻は難しく、12県を超えると規模に応じて隣国が敵対しやすくなります（同時に攻めてくる国数にも上限あり）。同盟国は対象外です。全国の95%を掌握すれば天下統一です。<br>生存国家：${l.length}/47</div>`;
}
function lineChart(series,o){o=o||{};const W=340,H=o.h||120,L=36,B=16,T=6,Rr=6,h=S.hist;if(h.length<2)return '<div class="mu" style="font-size:12px">データ蓄積中（10日ごとに記録）</div>';
 let mn=Infinity,mx=-Infinity;series.forEach(se=>se.v.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v}));if(o.zero&&mn>0)mn=0;if(mx===mn){mx+=1;mn-=o.zero?0:1}
 const d0=h[0].d,d1=h[h.length-1].d||1,X=d=>L+(d-d0)/Math.max(1,d1-d0)*(W-L-Rr),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B),f=v=>Math.abs(v)>=1000?Math.round(v):+v.toFixed(Math.abs(v)<10?1:0);
 let g="";for(let k=0;k<=2;k++){const v=mn+(mx-mn)*k/2,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="#2a3a4a"/><text x="${L-4}" y="${y+3}" fill="#8aa0b4" font-size="9" text-anchor="end">${f(v)}</text>`}
 g+=`<text x="${L}" y="${H-3}" fill="#8aa0b4" font-size="9">${d0}日</text><text x="${W-Rr}" y="${H-3}" fill="#8aa0b4" font-size="9" text-anchor="end">${d1}日</text>`;
 series.forEach(se=>{g+=`<polyline fill="none" stroke="${colOf(se.id)}" stroke-width="${se.w||1.6}" points="${se.v.map((v,i)=>X(h[i].d).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`});
 const lg=series.length>1?`<div style="font-size:11px;margin-top:2px">${series.map(se=>`<span style="margin-right:8px"><span class="dot" style="background:${colOf(se.id)};width:8px;height:8px"></span>${se.name}</span>`).join("")}</div>`:"";
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>${lg}`}
function tStat(){
 const n=me(),h=S.hist||[],my=owned(n.id).length,pct=my/NB*100,need=Math.max(0,Math.ceil(NB*.95)-my);
 const cnt={};S.prov.forEach(p=>cnt[p.owner]=(cnt[p.owner]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
 const topIds=top.filter(([id])=>+id!==n.id).slice(0,4).map(([id])=>+id);
 const ser=[{name:n.name+"国(自国)",color:"#fff",w:2.6,v:h.map(x=>x.c[n.id]/K)},...topIds.map(id=>({name:S.nations[id].name,color:colOf(id),v:h.map(x=>x.c[id]/K)}))];
 const inc=n.alive?income(n):0,up=upkeep(n);
 const bi=owned(n.id).filter(i=>!(S.prov[i].u>0)).map(i=>[i,blockInc(n,i)]).sort((a,b)=>b[1]-a[1]).slice(0,6),btot=owned(n.id).reduce((t,i)=>t+(S.prov[i].u>0?0:blockInc(n,i)),0)||1;
 const sec=t=>`<div style="margin:12px 0 2px"><b>${t}</b></div>`;
 return `<div class="card"><b>統一進捗</b> <span class="mu">全${NB}ブロックの95%で天下統一</span>
  <div class="bar" style="height:12px"><i style="width:${Math.min(100,pct/95*100)}%;background:var(--ac)"></i></div>
  <div>${my}/${NB}ブロック（${pct.toFixed(1)}%）<span class="mu">　あと${need}ブロック</span></div></div>`
 +sec("領土の推移（県換算）")+lineChart(ser,{h:130,zero:true})
 +sec("収支の推移（1日あたり）")+lineChart([{name:"総収入",color:"#6fd48a",v:h.map(x=>x.gi)},{name:"軍維持費",color:"#ff8d88",v:h.map(x=>x.u)},{name:"差引",color:"#e0a030",v:h.map(x=>x.gi-x.u),w:2.2}])
 +`<div class="kv" style="margin-top:4px"><div><span>総収入</span>+${(inc+up).toFixed(1)}</div><div><span>軍維持費</span>−${up.toFixed(1)}</div><div><span>差引</span>${inc>=0?"+":""}${inc.toFixed(1)}/日</div><div><span>貿易収入</span>+${(S.nations.filter(o=>o.alive&&o.id!==n.id&&R(n.id,o.id).trade).length*(n.pol==="diplo"?6:4)).toFixed(0)}</div></div>`
 +sec("資金の推移")+lineChart([{name:"資金",color:"#e0a030",v:h.map(x=>x.g)}])
 +sec("人口（万）と兵力")+lineChart([{name:"人口",color:"#6fa8ff",v:h.map(x=>x.p)}])+lineChart([{name:"兵力",color:"#ff8d88",v:h.map(x=>x.a)}],{h:90,zero:true})
 +sec("収入の多い県")+bi.map(([i,v])=>`<div class="row"><div class="nm"><a data-a="dfocus" data-p="${i}" style="color:var(--ac);cursor:pointer">${BN[i]}</a><div class="bar"><i style="width:${v/btot*100*3}%;background:#6fd48a;max-width:100%"></i></div></div><span class="mu">${v.toFixed(1)}（${(v/btot*100).toFixed(0)}%）</span></div>`).join("")
 +sec("勢力分布（上位10）")+top.map(([id,c])=>`<div class="row"><div class="nm"><span class="dot" style="background:${colOf(id)}"></span>${S.nations[id].name}国${+id===n.id?" ★":""}<div class="bar"><i style="width:${c/NB*100}%;background:${colOf(id)}"></i></div></div><span class="mu">${c}ブロック（${(c/NB*100).toFixed(1)}%）</span></div>`).join("")}
const tLog=()=>`<div class="log">${S.log.map(e=>`<div><span class="mu">${e.d}</span> ${e.t}</div>`).join("")}</div>`;

const onAct=e=>{
 const t=e.target.closest("[data-a]");if(!t||!S||!me().alive)return;
 const a=t.dataset.a,b=+t.dataset.b,p=+t.dataset.p,i=+t.dataset.i,n=me(),id=n.id;
 if(a==="infra")doInfra(n);else if(a==="tech")doTech(n);else if(a==="recruit")doRecruit(n);
 else if(a==="fac")doFac(n);else if(a==="msup")n.ms=Math.min(1,+(msOf(n)+.1).toFixed(1));else if(a==="msdn")n.ms=Math.max(0,+(msOf(n)-.1).toFixed(1));
 else if(a==="taxup")n.tax=Math.min(.5,+(n.tax+.05).toFixed(2));else if(a==="taxdn")n.tax=Math.max(.1,+(n.tax-.05).toFixed(2));
 else if(a==="war")openWar(b);else if(a==="peace")openPeace(b);
 else if(a==="ally")proposeAlly(id,b);else if(a==="unally")breakAlly(id,b);
 else if(a==="trade")proposeTrade(id,b);else if(a==="untrade")cutTrade(id,b);
 else if(a==="oy"||a==="on"){const o=S.offers[i];if(o){if(a==="on"&&o.t==="join")addTrust(id,o.f,-8);if(a==="oy"){const r=R(id,o.f);
  if(o.t==="join"){acceptJoin(o)}else if(o.t==="peace"||o.t==="surrender"){if(r.war){const w=getWar(id,o.f);signPeace(w,id,o.t==="surrender"?autoDemands(w,id,Math.max(0,wsOf(w,id))):new Set())}}else if(!r.war){if(o.t==="ally"){mkAlly(id,o.f,45);logm(`${n.name}国と${S.nations[o.f].name}国が同盟を結んだ。`)}else r.trade=true;toast("成立した。")}}
  S.offers.splice(i,1)}}
 else if(a==="dsel"){selD.has(i)?selD.delete(i):selD.add(i)}
 else if(a==="dhere"){DB[sel].filter(d=>d.o===id).forEach(d=>selD.add(d.id))}
 else if(a==="dall"){myDivs(id).forEach(d=>selD.add(d.id))}
 else if(a==="dclr")selD.clear();
 else if(a==="dstop")selDivs().forEach(d=>{d.path=[];d.prog=0});
 else if(a==="drecall")selDivs().forEach(recall);
 else if(a==="dfront"){const sl=selDivs(),ds=sl.length?sl:myDivs(id).filter(d=>d.gar===undefined&&d.str>=2);const[ok,fail]=deployFront(ds);toast(ok?`${ok}個師団を前線へ展開${fail?`（${fail}個は到達不可）`:""}`:"展開できる前線がありません");if(ok)selD.clear()}
 else if(a==="dborder"){const sl=selDivs(),ds=sl.length?sl:myDivs(id).filter(d=>d.gar===undefined&&d.str>=2);const[ok,fail]=deployBorder(ds);toast(ok?`${ok}個師団を国境へ均等に配置${fail?`（${fail}個は到達不可）`:""}`:"配置できる国境がありません");if(ok)selD.clear()}
 else if(a==="dspread"){const sl=selDivs(),ds=sl.length?sl:myDivs(id).filter(d=>d.gar===undefined&&d.str>=1);const c=spreadDivs(ds,false);toast(c?`${c}個師団を分散させた`:"分散できる師団がありません");if(c)selD.clear()}
 else if(a==="dsp"){n.sp=!n.sp;toast(n.sp?"自動分散：ON（待機中の師団が重ならないよう散らばります）":"自動分散：OFF")}
 else if(a==="dcamp"){const o=S.prov[sel].owner;if(o===id||!R(id,o).war)toast("戦争中の相手国の県を選んでから実行してください");else{let ds=selDivs();if(!ds.length)ds=myDivs(id).filter(d=>d.gar===undefined&&d.str>=2);const c=setCamp(ds,o);toast(`${c}個師団が${S.nations[o].name}国を自動攻略します`);selD.clear()}}
 else if(a==="dauto"){const sl=selDivs();(sl.length?sl:myDivs(id)).forEach(d=>{d.man=false;d.camp=undefined;d.gar=undefined});toast("自動管理に戻しました")}
 else if(a==="dag"){n.ag=!n.ag;toast(n.ag?"自動駐屯：ON（待機中の師団が不穏な占領地へ向かいます）":"自動駐屯：OFF")}
 else if(a==="mediate"){toast(mediate(b,+t.dataset.e),4500)}
 else if(a==="jreq"){toast(reqJoin(b,+t.dataset.e),4000)}
 else if(a==="sgold"){toast(giveGold(n,b)?"💰100を支援した（信頼度+4）":"支援できない")}
 else if(a==="seq"){toast(giveEq(n,b)?"🔧20を支援した（信頼度+3）":"支援できない")}
 else if(a==="aid"){toast(askAid(n,b),4000)}
 else if(a==="dfocus"){sel=p;focusB(p,1.8)}
 else if(a==="focus"){sel=capOf(b);focusB(sel,1.6)}
 else if(a==="pac")pacify(n,sel);else if(a==="pacall")pacifyAll(n);
 else if(a==="pacat"){if(pacify(n,p)){sel=p}}
 else if(a==="dev")doDev(n,sel);else if(a==="fort")doFort(n,sel);
 else if(a==="recat")doRecruit(n,sel);
 else if(a==="pol"){if(!setPol(n,t.dataset.k))toast(n.pol===t.dataset.k?"採用中の国策です":`国策は変更後${POLCD}日は切り替えられず、💰${POLCOST}が必要です`)}
 else if(a==="dgo"){const sl=selDivs();if(sl.length){const[ok,fail]=orderDivs(sl,sel);toast(ok?`${ok}個師団に命令${fail?`（${fail}個は到達不可）`:""}`:"そこへは進めない");if(ok)selD.clear()}}
 ui();
};
